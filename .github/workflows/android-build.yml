name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/TInvestBotMobile-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TInvestBotMobile-debug.apk
          path: app/build/outputs/apk/debug/TInvestBotMobile-debug.apk
          if-no-files-found: error
          retention-days: 30
